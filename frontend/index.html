<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" sizes="48x48">
        <link rel="icon" href="/designo-favicon.svg" type="image/svg+xml">
        <link rel="icon" href="/designo-favicon-32.png" type="image/png" sizes="32x32">
        <link rel="apple-touch-icon" href="/designo-favicon-180.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>designO</title>
        <script>
            (function () {
                const stored = localStorage.getItem("theme");
                const theme =
                    stored ||
                    (matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light");
                document.documentElement.classList.toggle(
                    "dark",
                    theme === "dark",
                );
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
