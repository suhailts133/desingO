<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background / Max Canvas Size -->
  <g fill="none" stroke="#D96B27" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Arc / 'D' Frame -->
    <path d="M 230 460 
             C 120 460, 40 375, 40 256 
             C 40 137, 120 52, 230 52 
             C 320 52, 395 108, 415 190" 
          stroke-width="52" />

    <!-- Architectural Roof / Upper Angle Structure -->
    <path d="M 235 220 
             L 380 75 
             L 460 155 
             L 460 380" 
          stroke-width="48" />

    <!-- Inner 'O' Loop / Hub -->
    <circle cx="235" cy="285" r="85" stroke-width="48" />
    
    <!-- Vertical Interior Accent Line -->
    <path d="M 365 240 L 365 440" stroke-width="44" />
    
  </g>
</svg>
