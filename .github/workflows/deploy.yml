name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Ensure Node & PM2 are found in PATH
            export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # 2. Enter project folder
            cd /home/ubuntu/backend

            # 3. Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # 4. Install dependencies and compile TypeScript
            npm install
            npm run build

            # 5. Restart PM2 with zero downtime
            pm2 reload designo-backend || pm2 start dist/server.js --name "designo-backend"
            pm2 save